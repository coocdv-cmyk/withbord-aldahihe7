name: CI

# This file replaces the inherited Django template, which failed on every
# push: the repository has no `manage.py` and no root `requirements.txt`.
#
# What it proves: the engine byte-compiles and the whole test suite passes on
# a clean machine, with the dependencies declared in `rasm-pro/requirements.txt`
# (so the published loudness numbers are reproducible).
#
# The suite covers the real contracts: scene fit, pause-aware alignment,
# scene-range audio offset, the shared production contract, credits, plan
# layout and direction, and the TTS contract.  Tests that need ffmpeg/ffprobe
# skip explicitly when the binary is absent — they never fail silently.

on:
  push:
    branches: [ "main", "master", "stage2-contract", "stage3-contract",
                "stage4-contract", "stage5-contract", "stage6-contract" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # rasm-pro/library/manifest-icons.jsonl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rasm-pro/requirements.txt
          pip install pytest
      - name: Compile check
        run: python -m compileall -q rasm-pro/engine rasm-pro/rasm.py rasm-pro/tools studio
      - name: Tests
        working-directory: rasm-pro
        run: python -m pytest -q tests
      - name: Test summary artifact
        if: always()
        working-directory: rasm-pro
        run: python -m pytest -q tests --junitxml=pytest-report.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-${{ matrix.os }}
          path: rasm-pro/pytest-report.xml
          if-no-files-found: ignore
