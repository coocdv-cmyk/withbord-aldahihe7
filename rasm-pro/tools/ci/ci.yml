name: CI

# Copy this file to `.github/workflows/ci.yml` to enable it.
#
# Why it lives here instead of in .github/workflows/: changing a workflow file
# needs a GitHub token with the `workflow` scope.  The local push token used
# for this repository does not have it, so the workflow file is kept here as a
# reviewed template and copied into place by someone who can write workflows
# (GitHub web UI: Add file -> Create new file -> .github/workflows/ci.yml).
#
# What it does: installs the engine dependencies, runs a compile check and
# the full test suite.  ubuntu-latest already ships ffmpeg/ffprobe; without
# them the affected tests skip explicitly instead of failing.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rasm-pro/requirements.txt
          pip install pytest
      - name: Compile check
        run: python -m compileall -q rasm-pro/engine rasm-pro/rasm.py rasm-pro/tools studio
      - name: Tests
        working-directory: rasm-pro
        run: python -m pytest -q tests
